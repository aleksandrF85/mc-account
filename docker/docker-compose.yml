version: '3'

services:
  postgres:
    image: postgres:16.3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=account_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  mc-account:
    image: mc-account:latest
    build: ..
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=postgres:5432
      - POSTGRES_DB_NAME=account_db
    depends_on:
      - postgres
