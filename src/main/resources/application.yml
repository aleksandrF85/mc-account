spring:
  application:
    name: mc-account

  main:
    allow-circular-references: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB_NAME:account_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      schema: account_schema
      connection-timeout: 10000
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS account_schema

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      retry.backoff.ms: 1000
      enable.idempotence: true

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: http://${EUREKA-HOST:localhost}:8761/eureka/
    fetch-registry: true
  instance:
    hostname: ${mc-account:localhost}
    prefer-ip-address: true

app:
  kafka:
    enable: true
    userRegistration: "REGISTER_TOP"
    resetPassword: "NOTIFICATION"
    emailChange: "ACCOUNT_CHANGES"
    accountChanges: "ACCOUNT_UPDATES"
    notification: "account.events"
    groupId: "socialNetwork-group-id"

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.netflix.eureka: DEBUG
    org.springframework.web.reactive.function.client.WebClient: DEBUG
    com.example.mc_account.services: DEBUG